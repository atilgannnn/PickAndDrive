server:
  port: ${PORT:8080}
  error:
    include-binding-errors: always
    include-message: always
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pickanddrive_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      '[hibernate.format_sql]': true

servlet:
  multipart:
    max-file-size: 10MB
    max-request-size: 10MB

logging:
  file:
    name: log/pickanddrive.log
  pattern:
    file: "%d %-5level [%thread] %logger:%msg%n"
  level:
    '[org.springframework.web]': WARN
    '[org.hibernate]': INFO
    '[com.pickanddrive]': DEBUG

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

pickanddrive:
  app:
    jwtSecret: ${JWT_SECRET:pickAndDriveSecretKey123!@#}
    jwtExpirationMs: 86400000

info:
  application:
    name: 'Pick & Drive Backend App'
    description: 'Pick & Drive Car Rental Backend Service'
    version: '@project.version@'